name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Typecheck first: it is the fastest signal.
      - name: Typecheck
        run: npm run typecheck

      # Unit, determinism, architecture, and content validation. No browser
      # needed, because the simulation never touches presentation.
      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

  browser:
    name: Visual, accessibility and layout (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The Chromium build that matches the pinned @playwright/test.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the game and serves it with `vite preview` (playwright.config.ts).
      - name: Browser checks
        run: npx playwright test
        env:
          CI: true

      # Expected / actual / diff images for any screen that changed.
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
